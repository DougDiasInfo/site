<!-- A Logo agora fica isolada e absoluta no canto superior esquerdo -->
<div class="brand-corner">

    <span class="status-dot pulse-green"></span>
</div>
    </header>

    <main class="page">
        <!-- Banner de Título com Glassmorphism -->
        <section class="video-hero-glass">
            <div class="badge-tech">
                <i class="fa-solid fa-clapperboard"></i> Treinamentos & Capacitação Clínica
            </div>
            <h1>Central de <span>Vídeos</span></h1>
            <p>Acesse tutoriais de operação, protocolos de integração de sistemas e treinamentos em vídeo de alta definição.</p>
        </section>

        <!-- Contêiner de Filtros Otimizado para Mobile -->
        <div class="filter-wrapper">
            <div class="input-search-box">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input 
                    id="buscaVideo"
                    class="busca"
                    placeholder="Pesquisar procedimentos, protocolos, módulos..."
                    type="text"
                    autocomplete="off"
                >
            </div>

            <select id="typeFilter" class="select-dark">
                <option value="">Todas as Categorias</option>
            </select>
        </div>

        <div id="contadorVideos" class="contador">
            <i class="fa-solid fa-spinner fa-spin"></i> Indexando tutoriais médicos...
        </div>

        <!-- Grid de Vídeos Responsivo -->
        <section class="video-grid" id="videoGrid">
            <!-- Injetado dinamicamente via js/videos.js -->
        </section>
    </main>
