<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Central de Vídeos - HealthTech Hub</title>
    <!-- CSS principal unificado -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/videos.css">
</head>
<body>
    <!-- Canvas de Partículas em Segundo Plano -->
    <canvas id="particlesCanvas"></canvas>

    <header>
        <img src="img/logo.png" class="logo" alt="HealthTech Logo" onerror="this.style.display='none'">
        <nav>
            <a href="index.html">Home</a>
            <a href="programas.html">Programas</a>
            <a href="downloads.html">Downloads</a>
            <a href="videos.html" class="active">Vídeos</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>

    <main class="page">
        <h1>Central de <span>Vídeos</span></h1>

        <!-- Contêiner de Filtros Responsivo para Mobile -->
        <div class="filter-wrapper">
            <input 
                id="buscaVideo"
                class="busca"
                placeholder="🔍 Pesquisar vídeos, protocolos..."
                type="text"
                autocomplete="off"
            >

            <select id="typeFilter" class="select-dark">
                <option value="">Todas as Categorias</option>
            </select>
        </div>

        <div id="contadorVideos" class="contador">
            Carregando vídeos...
        </div>

        <!-- Grid de Vídeos Otimizado -->
        <section class="video-grid" id="videoGrid">
            <!-- Injetado dinamicamente via js/videos.js -->
        </section>
    </main>

    <!-- Script de fundo (partículas) + Lógica de vídeos -->
    <script src="js/script.js"></script>
    <script src="js/videos.js"></script>
</body>
</html>
